name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      # The uploaded artifact is docs/ — only these three patterns can change it.
      - 'docs/**'
      # scripts/ holds the count guard's single source (scripts/test-count.txt) and the
      # guard script itself, so a change there re-runs the gate that validates the badge.
      - 'scripts/**'
      # Top-level markdown (README.md, AGENTS.md, CONTRIBUTING.md, ...) is swept by the
      # same count guard. Spelled '*.md', NOT '**.md': per GitHub's filter pattern cheat
      # sheet '**' matches zero or more of ANY character (including '/') while '*' does
      # not match '/'. So '**.md' could match specs/*.md — reopening the specs hole this
      # change closes — and it already matched nested non-published markdown in practice
      # (the 2026-09-18 push whose only non-board change was skills/h3-usage/SKILL.md
      # started this workflow). '*.md' cannot fire on anything under specs/ or docs/.
      - '*.md'
      # NOTE: 'specs/**' was removed (H3-PM-007). Specs are never published — the artifact
      # is docs/, and /h3/specs/... 404s — yet every specs-only push redeployed a
      # byte-identical artifact. Proven from this repo's own run history: the pushes whose
      # head commits 9d573d5, 4e45e7d, cd13c90 and b1a46e3 changed only specs/*.md and each
      # produced a pages.yml run + deploy. Trade-off, recorded on purpose: the count guard
      # no longer re-runs on a specs-only change in CI. `make verify` runs the same script
      # locally, and the guard still runs whenever docs/, scripts/ or a top-level doc changes.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # GAP-072 — the compliance-test count has exactly ONE home (scripts/test-count.txt).
  # This job fails the workflow when a current-state doc still quotes a retired
  # count, or when the sibling battery's EXPECTED_TEST_COUNT drifts away from the
  # canonical number, so a drifting count can never reach the published
  # docs/badge. Gated before deploy on purpose: the badge IS the public contract.
  count-guard:
    name: Compliance-test count guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout umbrella repo
        uses: actions/checkout@v4

      # Best-effort, so the umbrella never blocks on a sibling's availability:
      # enables the sibling-drift half of the guard (46 -> 47). If the checkout
      # fails, the guard still runs the doc sweep and reports parity as skipped.
      - name: Checkout sibling shim battery (parity source)
        id: shim
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: get-h3/shim
          path: .sibling-shim

      - name: Verify the compliance-test count is single-sourced and current
        env:
          H3_SHIM_BATTERY: ${{ steps.shim.outcome == 'success' && '.sibling-shim/src/h3_shim/test_battery.py' || '' }}
        run: sh scripts/check-test-count.sh

  deploy:
    needs: count-guard
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
