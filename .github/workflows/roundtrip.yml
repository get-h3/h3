name: H3 Cross-Language Round-Trip Verification

on:
  push:
    branches: [main]
    paths:
      - "integration/roundtrip/**"
      - "../sdk-go/protocol/**"
      - "../sdk-python/src/h3_harness/protocol.py"
      - "../sdk-typescript/src/protocol.ts"
  pull_request:
    branches: [main]
    paths:
      - "integration/roundtrip/**"
      - "../sdk-go/protocol/**"
      - "../sdk-python/src/h3_harness/protocol.py"
      - "../sdk-typescript/src/protocol.ts"
  workflow_dispatch:

jobs:
  roundtrip:
    name: Python ↔ Go Round-Trip
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: h3/integration/roundtrip

    steps:
      - name: Checkout umbrella repo
        uses: actions/checkout@v4
        with:
          path: h3

      - name: Checkout sdk-go
        uses: actions/checkout@v4
        with:
          repository: get-h3/sdk-go
          path: sdk-go

      - name: Checkout sdk-python
        uses: actions/checkout@v4
        with:
          repository: get-h3/sdk-python
          path: sdk-python

      - name: Checkout sdk-typescript
        uses: actions/checkout@v4
        with:
          repository: get-h3/sdk-typescript
          path: sdk-typescript

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        run: pip install uv

      - name: Install TypeScript SDK dependencies
        working-directory: sdk-typescript
        run: npm install

      - name: Run round-trip verification
        working-directory: h3/integration/roundtrip
        run: bash roundtrip.sh
