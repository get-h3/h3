guards:
  secrets: true
  lint: true
  tests: false         # umbrella repo — no test suite
  test_mode: diff
  # gitreins 0.14.0 makes a zero-work diff (board-only commits, and the judge's
  # pre-eval tier1 step which always runs against a clean index) a DEGRADED PASS
  # that exits 2. With tier1 `on_fail: block` that both refused board-only
  # commits and marked every judged verdict tier1 FAIL even when tier2 passed.
  # This is the umbrella's normal commit shape — its tracked content is markdown
  # plus the JSONL board, so "no Python files staged" is expected, not a defect.
  # allow_skips is the engine's documented opt-in (what `gitreins init` writes
  # for fresh repos); skipped gates stay named in the summary and the guard log.
  # Same fix already landed in the sibling repos (shim DF3-H3-SHIM-5, sdk-python).
  allow_skips: true

pipeline:
  stages:
    - id: tier1
      parallel: true
      on: [pre-commit, pre-eval]
      steps:
        - id: guard
          type: script
          run: "gitreins guard"
          on_fail: block
    - id: tier2
      type: ai_eval
      on: [pre-eval]
      condition: "true"
      max_iterations: -1
      # 1M starved the rel-005 tier2 (1,050,997 tokens_in == cap, tier1 PASS, no
      # merits finding) — raised one rung to 2M per the corpus verdict for
      # gitreins-tier2-input-token-cap-exceeded (exact-equality = starvation,
      # direction UP, move every location the knob appears in).
      max_input_tokens: "2M"
      max_output_tokens: "1M"
      max_time: "20m"
      tools: [read_file, run_command, search_pattern, read_diff, sandbox, detect_dead_code]

evaluator:
  max_iterations: 50
  max_time: 10m
  max_input_tokens: 2M
  max_output_tokens: 1M
  tool_call_weight: 0.1
  compaction_threshold: 0.90
  code_context_budget: 0.70
  fast_track: auto

defaults:
  model: deepseek-v4-flash
  provider: deepseek-foreman
  api_key_env: GITREINS_LLM_API_KEY
  max_iterations: 100
  check_for_updates: true
  update_check_ttl: "24h"
