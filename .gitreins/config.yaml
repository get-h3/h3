guards:
  secrets: true
  lint: true
  tests: false         # umbrella repo — no test suite
  test_mode: diff

pipeline:
  stages:
    - id: tier1
      parallel: true
      on: [pre-commit, pre-eval]
      steps:
        - id: guard
          type: script
          run: "gitreins guard"
          on_fail: block
    - id: tier2
      type: ai_eval
      on: [pre-eval]
      condition: "true"
      max_iterations: -1
      max_input_tokens: "1M"
      max_output_tokens: "1M"
      max_time: "20m"
      tools: [read_file, run_command, search_pattern, read_diff, sandbox, detect_dead_code]

evaluator:
  max_iterations: 50
  max_time: 10m
  max_input_tokens: 1M
  max_output_tokens: 1M
  tool_call_weight: 0.1
  compaction_threshold: 0.90
  code_context_budget: 0.70
  fast_track: auto

defaults:
  model: deepseek-v4-flash
  provider: deepseek-foreman
  api_key_env: GITREINS_LLM_API_KEY
  max_iterations: 100
  check_for_updates: true
  update_check_ttl: "24h"
